name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      apx_gcs_ref:
        description: apx-gcs git ref (branch, tag or commit) to build against, default by the plugin tag
        default: ""

env:
  # GCS sources the plugin is built against; empty: release-<version> of the plugin tag (v11.2.32.1 ->
  # release-11.2.32) when it exists, main otherwise (see scripts/build.sh)
  APX_GCS_REPO: https://github.com/uavos/apx-gcs.git
  APX_GCS_REF: ${{ github.event.inputs.apx_gcs_ref || '' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # the same image the GCS itself is built with (Qt, cmake, ninja, python tools)
    container:
      image: uavos/apx-gcs-linux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git config --global --add safe.directory '*'

      - name: Build plugin against apx-gcs ${{ env.APX_GCS_REF || 'release of the tag' }}
        run: scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emip-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    # same Qt version as the GCS release workflow (.github/workflows/apx-gcs-release.yml)
    env:
      VERSION_QT: 6.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git config --global --add safe.directory '*'

      - name: Install tools (python)
        run: python3 -m pip install networkx simplejson jinja2 pyyaml aqtinstall --break-system-packages

      - name: Install Qt
        working-directory: /tmp
        run: |
          aqt install-qt mac desktop $VERSION_QT -m \
            qtshadertools qt5compat qtcharts qtmultimedia \
            qtspeech qtlocation qtpositioning qtserialport \
            qtconnectivity qttasktree qtimageformats
          echo "/tmp/$VERSION_QT/macos/bin" >> $GITHUB_PATH

      - name: Build plugin against apx-gcs ${{ env.APX_GCS_REF || 'release of the tag' }}
        env:
          QT_PATH: /tmp/${{ env.VERSION_QT }}/macos
          # these GCS plugins need the SDL/GStreamer frameworks, not needed for ours
          APX_GCS_SKIP_PLUGINS: VideoStreaming Joystick
        run: |
          export CMAKE_PREFIX_PATH=$QT_PATH/lib/cmake
          export PKG_CONFIG_PATH=$QT_PATH/lib/pkgconfig
          scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emip-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: [build-linux, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          ls -la dist
          { echo '```'; cat dist/BUILD_INFO-*.txt; echo '```'; } > notes.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: EMIP ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
